  /v1/billing/buy:
    post:
      operationId: post_v1_billing_buy
      tags:
      - Billing
      summary: Purchase credits
      description: Purchases credits for a Vercel team using the default payment method on file. The purchase is charged immediately via Stripe
        invoice. Supported credit types are `v0`, `gateway`, and `agent`. The `amount` field specifies the number of credits to purchase and must
        be a positive integer. An optional `source` query parameter can be provided to identify the caller. Defaults to `api` if not specified.
        This is only available for Owner, Member, Developer, Security, and Billing roles for the supplied team.
      x-source: https://vercel.com/openapi.json
      parameters:
      - name: teamId
        in: query
        required: false
        schema:
          type: string
        description: The Team identifier to perform the request on behalf of.
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: The Team slug to perform the request on behalf of.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Optional source identifier for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostV1BillingBuyRequest'
      responses:
        '201':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1BillingBuyResponse'
      x-evidence:
